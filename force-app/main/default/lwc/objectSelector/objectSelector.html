<template>
    <div class="slds-box slds-theme_default slds-p-around_medium slds-m-around_medium">

        <div class="slds-grid slds-wrap slds-gutters">
            <!-- Object Selection Dropdown -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                <lightning-combobox label="Select Object" value={selectedObject} options={objectOptions}
                    onchange={handleObjectChange} class="slds-m-bottom_medium">
                </lightning-combobox>
            </div>
        </div>

        <!-- Field Selection Dual Listbox -->
        <template if:true={fieldOptions.length}>
            <div class="slds-grid slds-wrap slds-gutters">
                <div class="slds-col slds-size_1-of-1">
                    <lightning-dual-listbox name="fieldSelector" label="Select Fields" source-label="Available Fields"
                        selected-label="Selected Fields" options={fieldOptions} value={selectedFields}
                        onchange={handleFieldChange} class="slds-m-top_medium">
                    </lightning-dual-listbox>
                </div>
            </div>
        </template>

    </div>
</template>
