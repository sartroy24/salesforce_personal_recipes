<template>
    <template if:true={showTable}>
        <table border="1">
            <thead>
                <tr>
                    <template for:each={tableHeaders} for:item="field">
                        <th key={field.name} data-field={field.name} onclick={handleSort} style="cursor: pointer;">
                            {field.name}
                            <template if:true={field.isSorted}>
                                <span>
                                    <template if:true={isAscending}>▲</template>
                                    <template if:false={isAscending}>▼</template>
                                </span>
                            </template>
                        </th>
                    </template>
                </tr>
            </thead>
            <tbody>
                <template for:each={finalTableData} for:item="row">
                    <tr key={row.key}>
                        <template for:each={row.values} for:item="value" for:index="i">
                            <td key={row}>{value}</td>
                        </template>
                    </tr>
                </template>
            </tbody>
        </table>
    </template>
</template>
