<template>
    <div class="slds-card slds-p-around_medium">
        <!-- Header -->
        <div class="slds-text-heading_medium slds-p-bottom_small">
            Dynamic Object Data Viewer
        </div>
        <!-- Object and Field Selector -->
        <div class="slds-grid slds-wrap slds-gutters slds-p-bottom_medium">
            <div class="slds-col slds-size_1-of-1">
                <c-object-selector onselectionchange={handleSelectionChange}>
                </c-object-selector>
            </div>
            <lightning-button variant="brand" label="Fetch data" onclick={handleDataFetch} class="slds-m-left_x-small"></lightning-button>
        </div>
        <c-dynamic-data-table  selected-object={selectedObject} selected-fields={selectedFields} field-options={fieldOptions} lwc:ref="childRef"></c-dynamic-data-table>
    </div>
</template>
