<template>
    <div class="slds-card slds-p-around_medium">
        <!-- Header -->
        <div class="slds-text-heading_medium slds-p-bottom_small">
            Dynamic Object Data Viewer
        </div>
        <!-- Object and Field Selector -->
        <div class="slds-grid slds-wrap slds-gutters slds-p-bottom_medium">
            <div class="slds-col slds-size_1-of-1">
                <c-object-selector onselectionchange={handleSelectionChange}>
                </c-object-selector>
            </div>
            <div class="slds-col slds-size_1-of-1">
                <lightning-button variant="brand" label="Fetch data" onclick={handleDataFetch}
                    class="slds-p-left_x-small"></lightning-button>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-p-top_large">
                <c-dynamic-data-table selected-object={selectedObject} selected-fields={selectedFields}
                    final-table-data={dataAfterPageUpdate} field-options={fieldOptions} lwc:ref="childRef"
                    ondataupdate={handleDataUpdate} start={start} end={end}></c-dynamic-data-table>
            </div>
            <template lwc:if={showPagination}>
                <div class="slds-col slds-size_1-of-1 slds-p-top_small">
                    <c-pagination total-records={dataSize} page-size="10" onpagechange={handlePageChange}
                        lwc:ref="paginationRef">
                    </c-pagination>
                </div>
            </template>
        </div>
    </div>
</template>
