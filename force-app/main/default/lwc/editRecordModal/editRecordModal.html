<template>
    <lightning-modal-header label="Edit Record"></lightning-modal-header>
    <lightning-modal-body>
        <lightning-record-edit-form object-api-name={objectApiName} record-id={recordId} onsuccess={handleSuccess}
            onerror={handleError} lwc:ref="recordForm">
            <lightning-messages></lightning-messages>
            <template for:each={selectedFields} for:item="field">
                <lightning-input-field field-name={field} key={field}></lightning-input-field>
            </template>
        </lightning-record-edit-form>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button variant="neutral" label="Cancel" onclick={handleClose}></lightning-button>
        <lightning-button variant="brand" type="button" label="Save" onclick={handleSave} class="slds-m-left_small">
        </lightning-button>
    </lightning-modal-footer>
</template>
